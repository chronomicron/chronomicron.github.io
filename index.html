<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    ============================================================
    FILE: index.html
    PURPOSE: Main entry point of the personal digital profile site.
    ROLE IN PROJECT: This is the single page that users land on.
                    It contains the overall layout (top navigation bar,
                    left sidebar, and main content area). All content
                    is loaded dynamically from the Markdown files in
                    the /en/ folder (later /fr/ and /ja/ will be added).

    NAVIGATION MODEL:
      Top bar = high-level modes / audiences
        • Profile / Resume  → professional content for HR & managers
        • Projects          → technical & collaboration oriented
        • Personal          → interests & personality
        • Contact           → how to reach me + verification links
      Left sidebar = the actual pages belonging to the selected mode

    RESPONSIVE:
      On narrow screens a hamburger button opens the mode menu.
      The left sidebar stacks above the content.
    ============================================================
  -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robert Grou-Szabo — Personal Profile</title>
  <meta name="description" content="Electrical engineer focused on hardware, firmware, ASIC/FPGA and VLSI for computer vision and video processing. Profile, publications, projects, and contact for Robert Grou-Szabo." />

  <!-- Open Graph (LinkedIn, chat previews, etc.) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Robert Grou-Szabo — Personal Profile" />
  <meta property="og:description" content="Electrical engineer focused on hardware, firmware, ASIC/FPGA and VLSI for computer vision and video processing." />
  <meta property="og:url" content="https://chronomicron.github.io/" />

  <!-- Favicon (hourglass + scythe stamp) -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180x180.png" />

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Markdown parser (Marked.js) from CDN – converts .md files to HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <!-- ========== TOP HORIZONTAL NAVIGATION BAR ========== -->
  <header id="top-nav">
    <div class="nav-brand">
      <a href="#" data-mode="profile">Robert Grou-Szabo</a>
    </div>

    <!-- Hamburger – visible only on small screens -->
    <button id="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>

    <nav class="nav-links" id="nav-links">
      <!-- High-level modes -->
      <button class="nav-btn active" data-mode="profile">Profile / Resume</button>
      <button class="nav-btn" data-mode="projects">Projects</button>
      <button class="nav-btn" data-mode="personal">Personal</button>
      <button class="nav-btn" data-mode="contact">Contact</button>
    </nav>

    <!-- Theme toggle (left of languages) + language switcher -->
    <div class="top-controls">
      <button id="theme-toggle" type="button" class="theme-btn" title="Toggle light / dark"
              aria-label="Toggle color theme">◐</button>
      <div class="lang-switcher">
        <button class="lang-btn active" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="fr">FR</button>
        <button class="lang-btn" data-lang="ja">JA</button>
      </div>
    </div>
  </header>

  <!-- ========== MAIN LAYOUT: LEFT SIDEBAR + CONTENT ========== -->
  <div id="main-layout">

    <!-- Left contextual sidebar – changes according to the selected top mode -->
    <aside id="sidebar">
      <h2 id="sidebar-title">Profile / Resume</h2>
      <ul id="sidebar-menu">
        <!-- Populated dynamically by JavaScript -->
      </ul>
    </aside>

    <!-- Main content area – displays the selected Markdown content -->
    <main id="content">
      <div id="content-body">
        <!-- Markdown content will be rendered here -->
        <p>Loading…</p>
      </div>
    </main>

  </div>

  <!-- Main application logic -->
  <script src="js/main.js"></script>

  <!-- Default Statcounter code for chronomicron.com
  http://www.chronomicron.com -->
  <script type="text/javascript">
  var sc_project=6275478;
  var sc_invisible=1;
  var sc_security="6df071df";
  </script>
  <script type="text/javascript"
  src="https://www.statcounter.com/counter/counter.js"
  async></script>
  <noscript><div class="statcounter"><a title="Web Analytics"
  href="https://statcounter.com/" target="_blank"><img
  class="statcounter"
  src="https://c.statcounter.com/6275478/0/6df071df/1/"
  alt="Web Analytics"
  referrerPolicy="no-referrer-when-downgrade"></a></div></noscript>
  <!-- End of Statcounter Code -->
</body>
</html>
